name: Release on main

# Creates a GitHub release for every push or PR-merge to `main`, keeping the
# release tag and the *installed plugin version* in lockstep.
#
# Two files carry the version and they MUST agree:
#
#   - ./VERSION                            — drives the git tag (v{VERSION})
#   - ./.claude/.claude-plugin/plugin.json — drives what `claude plugin update`
#                                            sees, because the marketplace entry
#                                            for tech-agency is `"source": "./.claude"`
#                                            and carries no version of its own.
#
# Historically only VERSION was bumped, so installed users were pinned forever at
# the manifest's stale version and `claude plugin update` reported "already up to
# date". The parity gate below makes that class of drift a build failure, and the
# bump step now writes both files.
#
# Flow:
#   - Fail fast if VERSION and the plugin manifest disagree, or either is not semver.
#   - If the current VERSION has no release yet, release it directly, targeting the
#     pushed commit.
#   - If a release for the current VERSION already exists, bump the patch segment of
#     BOTH files, commit and push the bump to `main` as github-actions[bot], and
#     create the release for the new version, targeting the bump commit.
#   - Runs triggered by the bot's own bump push no-op (see the job-level `if`).
#
# Scope: this repo publishes exactly one plugin, `tech-agency`, whose manifest is
# `.claude/.claude-plugin/plugin.json` (the marketplace entry's source is `./.claude`).
# The companion `marketing-agency` plugin lives in its own repository and versions
# independently; nothing here touches it.
#
# This complements the client-side pre-commit hook (which bumps VERSION on
# local commits to main but cannot fire on GitHub-side merges): whichever path
# the commit arrives by, every merge to main produces exactly one release.
#
# COUPLING — hooks/pre-commit must bump BOTH files. Its auto-bump currently
# writes ./VERSION only; a local commit on main therefore lands VERSION at N+1
# with the plugin manifest still at N, and the parity gate below rejects that
# push, blocking the release. Until hooks/pre-commit stages
# .claude/.claude-plugin/plugin.json alongside VERSION, a local commit on main
# must set both files by hand (the hook's "already staged" guard leaves a
# manually staged VERSION untouched).
#
# Scope note: this auto-release applies to THIS meta/template repo only, where
# "release" means snapshotting the agency configuration. It is intentionally
# outside the gated Release Process defined in
# .claude/rules/shared/shared-standards.md (QA sign-off, security review,
# release notes, go/no-go), which governs product repos.

on:
  push:
    branches: [main]

# Needed to create tags/releases and to push the VERSION bump commit
# with the default GITHUB_TOKEN.
permissions:
  contents: write

concurrency:
  group: release-on-main
  cancel-in-progress: false

env:
  PLUGIN_MANIFEST: .claude/.claude-plugin/plugin.json

jobs:
  release:
    # Loop safety: the auto-bump path pushes a VERSION commit back to main.
    # Pushes made with the default GITHUB_TOKEN do not retrigger workflows,
    # but guard on the actor anyway (belt-and-braces, e.g. if the push token
    # is ever swapped for a PAT) so a bot-triggered run always no-ops instead
    # of bumping again and looping forever.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read version from VERSION file
        id: ver
        run: |
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file not found at repo root"
            exit 1
          fi
          VERSION="$(tr -d ' \t\r\n' < VERSION)"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION file does not contain a valid semver (got: '$VERSION')"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify VERSION matches the plugin manifest
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # The tag comes from VERSION; what users actually install comes from the
          # plugin manifest. If these two ever diverge, every release silently ships
          # a version nobody receives. Fail the run instead.
          if [ ! -f "$PLUGIN_MANIFEST" ]; then
            echo "::error::Plugin manifest not found at ${PLUGIN_MANIFEST}"
            exit 1
          fi
          if ! jq empty "$PLUGIN_MANIFEST" 2>/dev/null; then
            echo "::error::${PLUGIN_MANIFEST} is not valid JSON"
            exit 1
          fi
          MANIFEST_VERSION="$(jq -r '.version // ""' "$PLUGIN_MANIFEST")"
          if ! echo "$MANIFEST_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::${PLUGIN_MANIFEST} does not contain a valid semver version (got: '${MANIFEST_VERSION}')"
            exit 1
          fi
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::Version drift: VERSION is '${VERSION}' but ${PLUGIN_MANIFEST} is '${MANIFEST_VERSION}'. These must match — the tag comes from VERSION, the installed plugin version comes from the manifest. Set both to the same value and push again."
            exit 1
          fi
          echo "VERSION and ${PLUGIN_MANIFEST} agree: ${VERSION}"

      - name: Check whether a release exists for the current VERSION
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # Branch explicitly on the API result: HTTP 200 → release exists,
          # HTTP 404 → it doesn't, anything else (network, rate-limit, auth)
          # → fail the job rather than misreading a transient error as
          # "release doesn't exist" and attempting a bogus create.
          set +e
          RESPONSE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>&1)"
          EXIT=$?
          set -e
          if [ "$EXIT" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already exists — will bump patch and release the new version."
          elif echo "$RESPONSE" | grep -q "HTTP 404"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No release for ${TAG} yet — will release it directly."
          else
            echo "::error::Failed to check release existence for ${TAG}: ${RESPONSE}"
            exit 1
          fi

      - name: Bump patch version and push (current VERSION already released)
        id: bump
        if: steps.check.outputs.exists == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"

          # Both files move together — see the parity gate above. The scratch file
          # is written beside the manifest (not in $TMPDIR) so the rename is always
          # same-filesystem and leaves nothing behind on failure.
          printf '%s\n' "${NEW_VERSION}" > VERSION
          jq --arg v "${NEW_VERSION}" '.version = $v' "$PLUGIN_MANIFEST" > "${PLUGIN_MANIFEST}.tmp"
          mv "${PLUGIN_MANIFEST}.tmp" "$PLUGIN_MANIFEST"

          # Re-assert parity after writing, so a jq/mv failure can never ship drift.
          WROTE_VERSION="$(tr -d ' \t\r\n' < VERSION)"
          WROTE_MANIFEST="$(jq -r '.version // ""' "$PLUGIN_MANIFEST")"
          if [ "$WROTE_VERSION" != "${NEW_VERSION}" ] || [ "$WROTE_MANIFEST" != "${NEW_VERSION}" ]; then
            echo "::error::Bump failed to write ${NEW_VERSION} to both files (VERSION='${WROTE_VERSION}', manifest='${WROTE_MANIFEST}')"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION "$PLUGIN_MANIFEST"
          git commit -m "[TECH] @Claude: Auto-bump version to ${NEW_VERSION} (release-on-main workflow)"
          git push origin HEAD:main  # push-safety: allow the bot's VERSION bump is the one sanctioned write to main
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag and target commit
        id: rel
        env:
          EXISTS: ${{ steps.check.outputs.exists }}
          CUR_TAG: ${{ steps.ver.outputs.tag }}
          BUMP_TAG: ${{ steps.bump.outputs.tag }}
          BUMP_SHA: ${{ steps.bump.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EXISTS" = "true" ]; then
            echo "tag=${BUMP_TAG}" >> "$GITHUB_OUTPUT"
            echo "target=${BUMP_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${CUR_TAG}" >> "$GITHUB_OUTPUT"
            echo "target=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard against a stale tag without a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          # If the tag already exists but has no release (e.g. a manually
          # pushed tag), `gh release create` would silently attach the release
          # to the existing tag's commit and ignore --target. Fail loudly
          # instead so the stale tag gets investigated.
          set +e
          RESPONSE="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>&1)"
          EXIT=$?
          set -e
          if [ "$EXIT" -eq 0 ]; then
            echo "::error::Tag ${TAG} already exists but has no release. Refusing to attach a release to a pre-existing tag (it may point at the wrong commit). Delete or investigate the stale tag, then re-run."
            exit 1
          elif ! echo "$RESPONSE" | grep -q "HTTP 404"; then
            echo "::error::Failed to check tag existence for ${TAG}: ${RESPONSE}"
            exit 1
          fi
          echo "Tag ${TAG} does not exist yet — safe to create."

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
          TARGET: ${{ steps.rel.outputs.target }}
        run: |
          # --generate-notes builds the changelog server-side from merged PRs
          # since the previous release — no local git history needed.
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --target "$TARGET"
          echo "Created release ${TAG} targeting ${TARGET}."

      - name: Summary
        if: always()
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          TARGET: ${{ steps.rel.outputs.target }}
        run: |
          {
            echo "### Release on main"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tag | \`${TAG:-n/a}\` |"
            echo "| Target commit | \`${TARGET:-n/a}\` |"
            echo "| VERSION | \`$(tr -d ' \t\r\n' < VERSION 2>/dev/null || echo 'n/a')\` |"
            echo "| Plugin manifest version | \`$(jq -r '.version // "n/a"' "$PLUGIN_MANIFEST" 2>/dev/null || echo 'n/a')\` |"
          } >> "$GITHUB_STEP_SUMMARY"
