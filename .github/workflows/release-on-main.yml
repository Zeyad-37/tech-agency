name: Release on main

# Creates a GitHub release for every push or PR-merge to `main`:
#
#   - If the current ./VERSION (semver-validated) has no release yet, a release
#     is created for it directly, targeting the pushed commit.
#   - If a release for the current VERSION already exists, the workflow bumps
#     the patch segment of VERSION, commits and pushes the bump to `main` as
#     github-actions[bot], and creates the release for the new version,
#     targeting the bump commit.
#   - Runs triggered by the bot's own bump push no-op (see the job-level `if`).
#
# This complements the client-side pre-commit hook (which bumps VERSION on
# local commits to main but cannot fire on GitHub-side merges): whichever path
# the commit arrives by, every merge to main produces exactly one release.
#
# Scope note: this auto-release applies to THIS meta/template repo only, where
# "release" means snapshotting the agency configuration. It is intentionally
# outside the gated Release Process defined in
# .claude/rules/shared/shared-standards.md (QA sign-off, security review,
# release notes, go/no-go), which governs product repos.

on:
  push:
    branches: [main]

# Needed to create tags/releases and to push the VERSION bump commit
# with the default GITHUB_TOKEN.
permissions:
  contents: write

concurrency:
  group: release-on-main
  cancel-in-progress: false

jobs:
  release:
    # Loop safety: the auto-bump path pushes a VERSION commit back to main.
    # Pushes made with the default GITHUB_TOKEN do not retrigger workflows,
    # but guard on the actor anyway (belt-and-braces, e.g. if the push token
    # is ever swapped for a PAT) so a bot-triggered run always no-ops instead
    # of bumping again and looping forever.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read version from VERSION file
        id: ver
        run: |
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file not found at repo root"
            exit 1
          fi
          VERSION="$(tr -d ' \t\r\n' < VERSION)"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION file does not contain a valid semver (got: '$VERSION')"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether a release exists for the current VERSION
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # Branch explicitly on the API result: HTTP 200 → release exists,
          # HTTP 404 → it doesn't, anything else (network, rate-limit, auth)
          # → fail the job rather than misreading a transient error as
          # "release doesn't exist" and attempting a bogus create.
          set +e
          RESPONSE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>&1)"
          EXIT=$?
          set -e
          if [ "$EXIT" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already exists — will bump patch and release the new version."
          elif echo "$RESPONSE" | grep -q "HTTP 404"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No release for ${TAG} yet — will release it directly."
          else
            echo "::error::Failed to check release existence for ${TAG}: ${RESPONSE}"
            exit 1
          fi

      - name: Bump patch version and push (current VERSION already released)
        id: bump
        if: steps.check.outputs.exists == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "${NEW_VERSION}" > VERSION
          # VERSION is the single source of truth — propagate it to the plugin
          # manifest and README in the same commit, or the CI consistency check
          # fails on the very commit this workflow just pushed.
          ./scripts/sync-version.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION .claude/.claude-plugin/plugin.json README.md
          git commit -m "[TECH] @Claude: Auto-bump VERSION to ${NEW_VERSION} (release-on-main workflow)"
          git push origin HEAD:main
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag and target commit
        id: rel
        env:
          EXISTS: ${{ steps.check.outputs.exists }}
          CUR_TAG: ${{ steps.ver.outputs.tag }}
          BUMP_TAG: ${{ steps.bump.outputs.tag }}
          BUMP_SHA: ${{ steps.bump.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EXISTS" = "true" ]; then
            echo "tag=${BUMP_TAG}" >> "$GITHUB_OUTPUT"
            echo "target=${BUMP_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${CUR_TAG}" >> "$GITHUB_OUTPUT"
            echo "target=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard against a stale tag without a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          # If the tag already exists but has no release (e.g. a manually
          # pushed tag), `gh release create` would silently attach the release
          # to the existing tag's commit and ignore --target. Fail loudly
          # instead so the stale tag gets investigated.
          set +e
          RESPONSE="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>&1)"
          EXIT=$?
          set -e
          if [ "$EXIT" -eq 0 ]; then
            echo "::error::Tag ${TAG} already exists but has no release. Refusing to attach a release to a pre-existing tag (it may point at the wrong commit). Delete or investigate the stale tag, then re-run."
            exit 1
          elif ! echo "$RESPONSE" | grep -q "HTTP 404"; then
            echo "::error::Failed to check tag existence for ${TAG}: ${RESPONSE}"
            exit 1
          fi
          echo "Tag ${TAG} does not exist yet — safe to create."

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
          TARGET: ${{ steps.rel.outputs.target }}
        run: |
          # --generate-notes builds the changelog server-side from merged PRs
          # since the previous release — no local git history needed.
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --target "$TARGET"
          echo "Created release ${TAG} targeting ${TARGET}."
